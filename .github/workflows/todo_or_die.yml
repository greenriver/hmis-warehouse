name: Todo or Die

on:
  push:
    branches:
      - '*'
      - '**/*'
concurrency:
  group: ${{ github.ref }}-todo-or-die
  cancel-in-progress: true

jobs:
  todo_or_die_check:
    runs-on: ubuntu-24.04
    container: ruby:3.4.9-slim-bookworm
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        ruby: ['3.4.9']
      fail-fast: false

    env:
      RAILS_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Container Setup'
        uses: ./.github/workflows/container_setup

      - name: 'App setup'
        run: |
          cp config/secrets.yml.sample config/secrets.yml
          cp .rspec.sample .rspec
          cp config/database.yml.ci config/database.yml

      - name: Check for overdue TODOs
        run: bundle exec rails test:todo_or_die
