name: Doc Sources

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '*'
      - '**/*'
concurrency:
  group: ${{ github.ref }}-doc-sources
  cancel-in-progress: true

jobs:
  doc_sources_check:
    name: Documented sources match the manifest
    runs-on: ubuntu-24.04
    container: ruby:3.4.12-slim-trixie
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that documented sources match the manifest
        run: ruby bin/doc_sources check
