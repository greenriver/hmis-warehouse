name: Notify Slack on OpenPath Review Requested

on:
  pull_request:
    types: [labeled]

jobs:
  notify:
    if: github.event.label.name == 'needs-openpath-review'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL_OP_ENG }} \
          -H 'Content-type: application/json' \
          -d '{
            "text": "<!here> PR ready for review:\n*<${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>*\nOpened by: ${{ github.event.pull_request.user.login }}\nPlease ✅ this message to claim this review!"
          }'
