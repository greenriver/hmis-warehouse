name: Domain Pack

on:
  pull_request:
    branches:
      - '*'
      - '**/*'
concurrency:
  group: ${{ github.ref }}-domain-pack
  cancel-in-progress: true

jobs:
  domain_pack_check:
    name: Domain pack manifest is current
    runs-on: ubuntu-24.04
    container: ruby:3.4.9-slim-trixie
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that documented sources match the manifest
        run: ruby bin/domain_pack check
